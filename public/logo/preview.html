<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>bugva logo önizleme</title>
<style>
  body { margin: 0; background: #0a0a0c; color: #f5f3ec; font-family: system-ui, sans-serif; padding: 48px; }
  h2 { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #8b8880; margin: 0 0 16px; }
  .row { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; margin-bottom: 56px; }
  .cell { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .light { background: #f5f3ec; border-radius: 16px; padding: 24px; }
</style>
</head>
<body>
  <h2>Amblem</h2>
  <div class="row">
    <div class="cell"><img src="/logo/bugva-mark.svg" width="140"></div>
    <div class="cell"><img src="/logo/bugva-mark.svg" width="72"></div>
    <div class="cell"><img src="/logo/bugva-mark.svg" width="36"></div>
    <div class="cell light"><img src="/logo/bugva-mark.svg" width="96"></div>
  </div>
  <h2>Logotip — bugva</h2>
  <div class="row">
    <div class="cell"><img src="/logo/bugva-wordmark.svg" width="420"></div>
    <div class="cell"><img src="/logo/bugva-wordmark.svg" width="220"></div>
  </div>
  <h2>Rozet (favicon / avatar)</h2>
  <div class="row">
    <div class="cell"><img src="/logo/bugva-badge.svg" width="160"></div>
    <div class="cell"><img src="/logo/bugva-badge.svg" width="64"></div>
    <div class="cell"><img src="/logo/bugva-badge.svg" width="32"></div>
  </div>
</body>
</html>
